services:
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: postgres
      POSTGRES_DB: event_berlin_development
    networks:
      - backend
    # No published ports — reachable only from containers on `backend`.
    # Need a shell in? `docker compose exec db psql -U postgres`

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - backend

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    volumes:
      - .:/rails
      - rails_tmp:/rails/tmp
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/event_berlin_development
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      REDIS_URL: redis://redis:6379/0
    networks:
      - backend
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # LAN / Tailscale — plain HTTP
      - "traefik.http.routers.eventberlin-api-binary.rule=Host(`api.eventberlin.binary`)"
      - "traefik.http.routers.eventberlin-api-binary.entrypoints=web"
      - "traefik.http.routers.eventberlin-api-binary.service=eventberlin-api"
      # Public — via Cloudflare Tunnel, TLS
      - "traefik.http.routers.eventberlin-api-kancodes.rule=Host(`api.eventberlin.kancodes.de`)"
      - "traefik.http.routers.eventberlin-api-kancodes.entrypoints=websecure"
      - "traefik.http.routers.eventberlin-api-kancodes.tls=true"
      - "traefik.http.routers.eventberlin-api-kancodes.service=eventberlin-api"
      - "traefik.http.services.eventberlin-api.loadbalancer.server.port=3000"

  worker:
    build: .
    command: bundle exec sidekiq
    volumes:
      - .:/rails
      - rails_tmp:/rails/tmp
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/event_berlin_development
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --hostname 0.0.0.0 --port 3001
    depends_on:
      - web
    environment:
      NEXT_PUBLIC_API_URL: https://api.eventberlin.kancodes.de/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.eventberlin-web-binary.rule=Host(`eventberlin.binary`)"
      - "traefik.http.routers.eventberlin-web-binary.entrypoints=web"
      - "traefik.http.routers.eventberlin-web-binary.service=eventberlin-web"
      - "traefik.http.routers.eventberlin-web-kancodes.rule=Host(`eventberlin.kancodes.de`)"
      - "traefik.http.routers.eventberlin-web-kancodes.entrypoints=websecure"
      - "traefik.http.routers.eventberlin-web-kancodes.tls=true"
      - "traefik.http.routers.eventberlin-web-kancodes.service=eventberlin-web"
      - "traefik.http.services.eventberlin-web.loadbalancer.server.port=3001"

networks:
  proxy:
    external: true
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  rails_tmp: