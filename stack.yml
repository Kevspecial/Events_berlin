# ------------------------------------------------------------------------
# LOCAL DEVELOPMENT ONLY — LAN / Tailscale access via the `web` entrypoint.
#
# This stack runs Rails and Next.js in development mode with the host
# source tree bind-mounted read-write into the containers for fast local
# iteration. It must NEVER be given a public router (no `websecure`
# entrypoint, no public host, no TLS labels). Doing so
# would let anyone reach a development-mode server with live-reloaded,
# writable source — an arbitrary file write becomes remote code execution
# on the next request. Production is served exclusively by stack.prod.yml.
# ------------------------------------------------------------------------
name: eventberlin-dev

services:
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}
      POSTGRES_USER: postgres
      POSTGRES_DB: event_berlin_development
    networks:
      - backend
    # No published ports — reachable only from containers on `backend`.
    # Need a shell in? `docker compose exec db psql -U postgres`

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - backend

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    volumes:
      - .:/rails
      - rails_tmp:/rails/tmp
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/event_berlin_development
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
      REDIS_URL: redis://redis:6379/0
      # Stripe features are inert locally until real test keys are supplied
      # via .env (see .env.example). FRONTEND_URL defaults to the LAN dev
      # host used by the frontend service below.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://eventberlin.binary}
      # Placeholder only — not a real secret. JWTs signed with this value are
      # worthless outside local development and must never be trusted in any
      # shared or public environment.
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY:-dev-only-not-a-real-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://eventberlin.binary,http://localhost:3001}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAILER_DOMAIN: ${MAILER_DOMAIN:-eventberlin.binary}
    networks:
      - backend
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # LAN / Tailscale — plain HTTP
      - "traefik.http.routers.eventberlin-api-binary.rule=Host(`api.eventberlin.binary`)"
      - "traefik.http.routers.eventberlin-api-binary.entrypoints=web"
      - "traefik.http.routers.eventberlin-api-binary.service=eventberlin-api"
      - "traefik.http.services.eventberlin-api.loadbalancer.server.port=3000"

  worker:
    build: .
    command: bundle exec sidekiq
    volumes:
      - .:/rails
      - rails_tmp:/rails/tmp
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set — see .env.example}@db:5432/event_berlin_development
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
      # Stripe features are inert locally until real test keys are supplied
      # via .env (see .env.example).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://eventberlin.binary}
      # Placeholder only — not a real secret. JWTs signed with this value are
      # worthless outside local development and must never be trusted in any
      # shared or public environment.
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY:-dev-only-not-a-real-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://eventberlin.binary,http://localhost:3001}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      MAILER_DOMAIN: ${MAILER_DOMAIN:-eventberlin.binary}
    networks:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    command: npm run dev -- --hostname 0.0.0.0 --port 3001
    depends_on:
      - web
    environment:
      NEXT_PUBLIC_API_URL: http://api.eventberlin.binary/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.eventberlin-web-binary.rule=Host(`eventberlin.binary`)"
      - "traefik.http.routers.eventberlin-web-binary.entrypoints=web"
      - "traefik.http.routers.eventberlin-web-binary.service=eventberlin-web"
      - "traefik.http.services.eventberlin-web.loadbalancer.server.port=3001"

networks:
  proxy:
    external: true
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  rails_tmp:
